<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nova · CSS Peeps avatar demo</title>
  <!-- La API data-css-peeps es más estable en overlays Chromium/OBS. -->
  <link rel="stylesheet" href="https://unpkg.com/css-peeps@1/css-peeps.compat.css">
  <script type="importmap">
    { "imports": { "@nekuda/webmcp-sdk": "./webmcp/vendor/nekuda-webmcp-sdk-0.5.0/index.js" } }
  </script>
  <script>
    // Debe ejecutarse antes de pintar el body para que OBS no vea un flash opaco.
    if (new URLSearchParams(location.search).get("mode") === "overlay") {
      document.documentElement.classList.add("overlay-mode");
    }
  </script>
  <style>
    :root { color-scheme: dark; font-family: Inter, system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 15% 15%, #263b79, #0d1020 54%, #070812); color: #eff2ff; }
    main { display: grid; grid-template-columns: minmax(300px, 440px) minmax(260px, 380px); gap: 28px; align-items: center; padding: 30px; }
    .stage { min-height: 560px; display: grid; place-items: end center; border: 1px solid #6e7bcf55; border-radius: 28px; background: linear-gradient(160deg, #111936cc, #24154dcc); overflow: hidden; position: relative; box-shadow: 0 28px 60px #0008; }
    .stage::after { content: "CSS Peeps · prototipo local"; position: absolute; bottom: 16px; color: #c8d5ff99; font-size: 12px; letter-spacing: .08em; }
    .avatar-transform { transform-origin: bottom center; }
    .avatar-transform.flipped { transform: scaleX(-1); }
    .peep { width: 330px; height: 446px; margin-bottom: 34px; --peep-head: bangs1; --peep-face: talking; --peep-body: explaining; --peep-hair-color: #ff77b7; --peep-skin-color: #f2b28f; --peep-clothes-color: #f4efff; --peep-accessory-color: #ffd75a; --peep-object-color: #61dafb; filter: drop-shadow(0 16px 18px #0008); transform-origin: bottom center; }
    .peep.idle { animation: breathe 3.2s ease-in-out infinite alternate; }
    .peep.speaking { animation: talking .17s ease-in-out infinite alternate; }
    .peep.reacting { animation: reaction .55s cubic-bezier(.2, 1.6, .4, 1) 4; }
    @keyframes breathe { to { transform: translateY(-8px) rotate(-1deg); } }
    @keyframes talking { to { transform: translateY(-13px) scale(1.025) rotate(.7deg); } }
    @keyframes reaction { 50% { transform: translateY(-22px) rotate(-7deg) scale(1.08); } }
    section { background: #10152be8; border: 1px solid #8397e044; border-radius: 22px; padding: 22px; box-shadow: 0 16px 45px #0005; }
    h1 { font-size: 22px; margin: 0 0 8px; } p { color: #bdc7eb; line-height: 1.5; }
    h2 { font-size: 15px; margin: 20px 0 10px; color: #e9edff; }
    textarea { width: 100%; min-height: 240px; padding: 12px; box-sizing: border-box; border-radius: 12px; background: #080c1d; border: 1px solid #5368af; color: #dbe5ff; font: 12px ui-monospace, monospace; }
    .picker { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .picker label { display: grid; gap: 5px; color: #bdc7eb; font-size: 12px; }
    .picker select, .picker input { min-width: 0; box-sizing: border-box; border: 1px solid #5368af; border-radius: 8px; background: #080c1d; color: #edf1ff; padding: 8px; }
    .picker input[type="color"] { width: 100%; height: 37px; padding: 3px; cursor: pointer; }
    .picker .toggle { display: flex; align-items: center; gap: 8px; }
    .picker .toggle input { min-width: auto; }
    .asset-group { grid-column: 1 / -1; }
    .asset-group[hidden] { display: none; }
    .asset-group > span { display: block; margin-bottom: 6px; color: #bdc7eb; font-size: 12px; }
    .part-tabs { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px; }
    .part-tab { padding: 7px 9px; font-size: 11px; background: #222c59; color: #cbd5ff; }
    .part-tab.active { background: #526bd6; color: #fff; }
    .asset-grid { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; }
    .asset-option { min-width: 0; min-height: 92px; display: grid; grid-template-rows: 65px auto; place-items: center; padding: 4px; border: 1px solid #5368af; border-radius: 9px; background: #080c1d; color: #bdc7eb; cursor: pointer; font-size: 9px; line-height: 1.15; text-align: center; overflow: hidden; }
    .asset-option:hover { border-color: #8fa4ff; background: #172047; }
    .asset-option.selected { border-color: #87f0c3; box-shadow: 0 0 0 1px #87f0c388; background: #183d42; color: #effff8; }
    .asset-preview { width: 58px; height: 65px; --peep-hair-color: #ff77b7; --peep-skin-color: #f2b28f; --peep-clothes-color: #f4efff; --peep-accessory-color: #ffd75a; }
    .controls { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 14px; }
    button { border: 0; border-radius: 10px; padding: 10px 13px; color: #fff; background: #526bd6; cursor: pointer; font-weight: 700; } button:hover { background: #6d85f1; }
    .status { margin-top: 14px; color: #87f0c3; font-size: 13px; }
    /* URL para OBS: ?mode=overlay. Conserva sólo el avatar y su canal alfa. */
    .overlay-mode,
    .overlay-mode body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    .overlay-mode body { display: block; min-height: 0; }
    .overlay-mode main { display: block; padding: 0; width: 100%; height: 100%; }
    .overlay-mode .stage { min-height: 0; width: 100%; height: 100%; border: 0; border-radius: 0; background: transparent; box-shadow: none; display: grid; place-items: end center; overflow: visible; }
    .overlay-mode .stage::after,
    .overlay-mode main > section { display: none; }
    .overlay-mode .peep { margin-bottom: 0; }
    .overlay-mode .stage[data-position="left"] { place-items: end start; }
    .overlay-mode .stage[data-position="center"] { place-items: end center; }
    .overlay-mode .stage[data-position="right"] { place-items: end end; }
    @media (max-width: 780px) { main { grid-template-columns: 1fr; padding: 16px; } .stage { min-height: 480px; } }
  </style>
</head>
<body>
  <main>
    <div class="stage" id="stage"><div class="avatar-transform" id="avatar-transform"><div id="peep" class="css-peeps peep idle" aria-label="Avatar de Nova"></div></div></div>
    <section>
      <h1>Nova avatar · estado controlado</h1>
      <p>El JSON persistente define la identidad. El estado temporal cambia al hablar o reaccionar sin reescribir esa identidad.</p>
      <h2>Armar personaje</h2>
      <div class="picker" id="picker">
        <div class="part-tabs" role="tablist">
          <button type="button" class="part-tab active" data-part="head">Cabeza</button>
          <button type="button" class="part-tab" data-part="face">Rostro</button>
          <button type="button" class="part-tab" data-part="accessory">Accesorios</button>
          <button type="button" class="part-tab" data-part="facialHair">Vello facial</button>
          <button type="button" class="part-tab" data-part="body">Cuerpo</button>
          <button type="button" class="part-tab" data-part="colors">Colores</button>
          <button type="button" class="part-tab" data-part="transform">Transformar</button>
        </div>
        <div class="asset-group" data-part-panel="head"><span>Cabeza</span><div class="asset-grid" id="picker-head"></div></div>
        <div class="asset-group" data-part-panel="face" hidden><span>Rostro</span><div class="asset-grid" id="picker-face"></div></div>
        <div class="asset-group" data-part-panel="accessory" hidden><span>Accesorios</span><div class="asset-grid" id="picker-accessory"></div></div>
        <div class="asset-group" data-part-panel="facialHair" hidden><span>Vello facial</span><div class="asset-grid" id="picker-facialHair"></div></div>
        <div class="asset-group" data-part-panel="body" hidden><span>Ropa / pose</span><div class="asset-grid" id="picker-body"></div></div>
        <div class="asset-group" data-part-panel="colors" hidden><span>Colores</span><div class="picker">
          <label>Color de pelo<input id="picker-hair" type="color"></label>
          <label>Color de piel<input id="picker-skin" type="color"></label>
          <label>Color de ropa<input id="picker-clothes" type="color"></label>
          <label>Color de accesorio<input id="picker-accessory" type="color"></label>
          <label>Color de vello facial<input id="picker-facialHair" type="color"></label>
          <label>Color de objeto<input id="picker-object" type="color"></label>
          <label>Color de sombrero<input id="picker-hat" type="color"></label>
        </div></div>
        <div class="asset-group" data-part-panel="transform" hidden><span>Transformar</span><div class="picker">
          <label>Posición<select id="picker-position"><option value="left">Izquierda</option><option value="center">Centro</option><option value="right">Derecha</option></select></label>
          <label class="toggle"><input id="picker-flip" type="checkbox"> Espejar avatar</label>
        </div></div>
      </div>
      <textarea id="config" spellcheck="false"></textarea>
      <div class="controls">
        <button id="apply">Aplicar JSON</button>
        <button id="export-character">Exportar personaje</button>
        <button id="import-character">Cargar personaje</button>
        <button id="talk">Hablar 5 s</button>
        <button id="react">Reaccionar</button>
        <button id="idle">Reposo</button>
      </div>
      <input id="character-file" type="file" accept="application/json,.json" hidden>
      <div class="status" id="status">Estado: idle</div>
    </section>
  </main>
  <script>
    const avatar = {
      identity: {
        head: "bangs1", face: "talking", body: "explaining",
        accessory: null, facialHair: null,
        colors: { hair: "#ff77b7", skin: "#f2b28f", clothes: "#f4efff", accessory: "#ffd75a", facialHair: "#5b3b2e", object: "#61dafb", hat: "#a57cff" }
      },
      state: { expression: "idle", speaking: false, reaction: "none" }
    };
    const peep = document.querySelector('#peep');
    const stage = document.querySelector('#stage');
    const avatarTransform = document.querySelector('#avatar-transform');
    const text = document.querySelector('#config');
    const status = document.querySelector('#status');
    const characterFile = document.querySelector('#character-file');
    const picker = document.querySelector('#picker');
    let reactionTimer;
    const CHARACTER_FORMAT = 'nova-avatar-character/v1';
    const params = new URLSearchParams(location.search);
    const requestedPosition = params.get('position');
    const requestedFlip = params.get('flip');
    const presentation = {
      position: ["left", "center", "right"].includes(requestedPosition) ? requestedPosition : "center",
      flip: requestedFlip === "true" || requestedFlip === "1"
    };
    const avatarOptions = Object.freeze({
      heads: ["afro", "bald1", "bangs1", "bangs2", "bun1", "long-bangs", "long-curly", "medium1", "mohawk1", "short1"],
      faces: ["awe", "calm", "cheeky", "gasp", "laughing", "serious", "smile", "talking"],
      bodies: ["blazer", "coffee", "explaining", "gaming", "hoodie", "jacket", "laptop", "pointing-up", "sporty-tee", "tee1"],
      colorFormat: "#RRGGBB",
      accessories: ["none", "eyepatch", "glasses1", "glasses2", "glasses3", "glasses4", "glasses5", "sunglasses1", "sunglasses2"],
      facialHairs: ["none", "chinhair", "beard1", "beard2", "beard3", "beard4", "goatee1", "goatee2", "mustache1", "mustache2", "mustache3", "mustache4", "mustache5", "mustache6", "mustache7", "mustache8", "mustache9"],
      colorFields: ["hair", "skin", "clothes", "accessory", "facialHair", "object", "hat"]
    });
    const colorCssNames = { facialHair: 'facial-hair' };

    function render() {
      const { identity, state } = avatar;
      // La API compatible de CSS Peeps activa las máscaras y capas correctas.
      peep.dataset.cssPeeps = [identity.head, state.speaking ? 'talking' : identity.face, identity.accessory, identity.facialHair, identity.body].filter(Boolean).join(' ');
      peep.style.removeProperty('--peep-head');
      peep.style.removeProperty('--peep-face');
      peep.style.removeProperty('--peep-body');
      for (const color of avatarOptions.colorFields) peep.style.setProperty(`--peep-${colorCssNames[color] || color}-color`, identity.colors[color]);
      peep.style.removeProperty('--peep-clothes-custom-paint');
      peep.className = `css-peeps peep ${state.speaking ? 'speaking' : 'idle'} ${state.reaction !== 'none' ? 'reacting' : ''}`;
      status.textContent = `Estado: ${state.speaking ? 'speaking' : state.reaction !== 'none' ? state.reaction : 'idle'}`;
      text.value = JSON.stringify({ identity: avatar.identity, state: avatar.state, presentation }, null, 2);
      syncPicker();
    }
    function renderPresentation() {
      stage.dataset.position = presentation.position;
      avatarTransform.classList.toggle('flipped', presentation.flip);
      syncPicker();
    }
    function setState(patch) { Object.assign(avatar.state, patch); render(); }

    function requireOption(value, options, field) {
      if (typeof value !== 'string' || !options.includes(value)) {
        throw new TypeError(`${field} must be one of: ${options.join(', ')}`);
      }
      return value;
    }
    function requireColor(value, field) {
      if (typeof value !== 'string' || !/^#[0-9a-f]{6}$/i.test(value)) {
        throw new TypeError(`${field} must use the #RRGGBB color format`);
      }
      return value.toLowerCase();
    }
    function optionalOption(value, options, field) {
      const selected = value ?? 'none';
      requireOption(selected, options, field);
      return selected === 'none' ? null : selected;
    }
    function validateDesign(design) {
      if (!design || typeof design !== 'object' || Array.isArray(design)) {
        throw new TypeError('design must be an object');
      }
      const colors = { ...avatar.identity.colors, ...design.colors };
      if (!colors || typeof colors !== 'object' || Array.isArray(colors)) {
        throw new TypeError('colors must be an object');
      }
      return {
        head: requireOption(design.head, avatarOptions.heads, 'head'),
        face: requireOption(design.face, avatarOptions.faces, 'face'),
        body: requireOption(design.body, avatarOptions.bodies, 'body'),
        accessory: optionalOption(design.accessory, avatarOptions.accessories, 'accessory'),
        facialHair: optionalOption(design.facialHair, avatarOptions.facialHairs, 'facialHair'),
        colors: Object.fromEntries(avatarOptions.colorFields.map((field) => [field, requireColor(colors[field], `colors.${field}`)]))
      };
    }
    function getOptions() {
      return structuredClone({ options: avatarOptions, current: avatar.identity, presentation });
    }
    function pickerValue(field) {
      return document.querySelector(`#picker-${field} .asset-option.selected`)?.dataset.value;
    }
    function populatePicker(field, choices) {
      const grid = document.querySelector(`#picker-${field}`);
      grid.replaceChildren(...choices.map((choice) => {
        const option = document.createElement('button');
        option.type = 'button';
        option.className = 'asset-option';
        option.dataset.value = choice;
        option.setAttribute('aria-label', `${field}: ${choice}`);
        const preview = document.createElement('div');
        preview.className = 'css-peeps asset-preview';
        const caption = document.createElement('span');
        caption.textContent = choice;
        option.append(preview, caption);
        option.onclick = () => {
          grid.querySelectorAll('.asset-option').forEach((item) => item.classList.remove('selected'));
          option.classList.add('selected');
          applyPicker();
        };
        return option;
      }));
    }
    function syncPicker() {
      if (!picker) return;
      for (const field of ['head', 'face', 'accessory', 'facialHair', 'body']) {
        const selected = avatar.identity[field];
        document.querySelectorAll(`#picker-${field} .asset-option`).forEach((option) => {
          option.classList.toggle('selected', option.dataset.value === (selected || 'none'));
          const preview = option.querySelector('.asset-preview');
          preview.dataset.cssPeeps = [
            field === 'head' ? option.dataset.value : avatar.identity.head,
            field === 'face' ? option.dataset.value : avatar.identity.face,
            field === 'accessory' ? option.dataset.value : avatar.identity.accessory,
            field === 'facialHair' ? option.dataset.value : avatar.identity.facialHair,
            field === 'body' ? option.dataset.value : avatar.identity.body
          ].filter((part) => part && part !== 'none').join(' ');
          for (const color of avatarOptions.colorFields) preview.style.setProperty(`--peep-${colorCssNames[color] || color}-color`, avatar.identity.colors[color]);
        });
      }
      document.querySelector('#picker-position').value = presentation.position;
      for (const field of avatarOptions.colorFields) document.querySelector(`#picker-${field}`).value = avatar.identity.colors[field];
      document.querySelector('#picker-flip').checked = presentation.flip;
    }
    function applyPicker() {
      try {
        applyDesign({
          head: pickerValue('head'),
          face: pickerValue('face'),
          body: pickerValue('body'),
          accessory: pickerValue('accessory'),
          facialHair: pickerValue('facialHair'),
          colors: Object.fromEntries(avatarOptions.colorFields.map((field) => [field, document.querySelector(`#picker-${field}`).value]))
        });
        applyPresentation({ position: document.querySelector('#picker-position').value, flip: document.querySelector('#picker-flip').checked });
        status.textContent = 'Selección aplicada.';
      } catch (error) { status.textContent = `Selección no válida: ${error.message}`; }
    }
    function applyDesign(design) {
      avatar.identity = validateDesign(design);
      render();
      return structuredClone(avatar.identity);
    }
    function applyPresentation(next) {
      if (!next || typeof next !== 'object' || Array.isArray(next)) {
        throw new TypeError('presentation must be an object');
      }
      if (!["left", "center", "right"].includes(next.position)) {
        throw new TypeError('position must be left, center, or right');
      }
      if (typeof next.flip !== 'boolean') {
        throw new TypeError('flip must be a boolean');
      }
      presentation.position = next.position;
      presentation.flip = next.flip;
      renderPresentation();
      return structuredClone(presentation);
    }
    function characterDocument() {
      return {
        format: CHARACTER_FORMAT,
        identity: structuredClone(avatar.identity),
        presentation: structuredClone(presentation)
      };
    }
    function exportCharacter() {
      const blob = new Blob([JSON.stringify(characterDocument(), null, 2) + '\n'], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.download = 'nova-avatar-character.json';
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 0);
      status.textContent = 'Personaje exportado como JSON.';
    }
    async function importCharacter(file) {
      if (!file) return;
      if (file.size > 100_000) throw new TypeError('El archivo supera el límite de 100 KB.');
      const imported = JSON.parse(await file.text());
      if (imported.format !== CHARACTER_FORMAT) {
        throw new TypeError('El archivo no es un personaje Nova compatible.');
      }
      applyDesign(imported.identity);
      if (imported.presentation !== undefined) applyPresentation(imported.presentation);
      status.textContent = 'Personaje cargado correctamente.';
    }
    window.novaAvatar = {
      setState,
      getOptions,
      applyDesign,
      applyPresentation,
      get presentation() { return structuredClone(presentation); },
      get state() { return structuredClone(avatar.state); }
    };
    populatePicker('head', avatarOptions.heads);
    populatePicker('face', avatarOptions.faces);
    populatePicker('accessory', avatarOptions.accessories);
    populatePicker('facialHair', avatarOptions.facialHairs);
    populatePicker('body', avatarOptions.bodies);
    picker.querySelectorAll('.part-tab').forEach((tab) => tab.onclick = () => {
      picker.querySelectorAll('.part-tab').forEach((item) => item.classList.toggle('active', item === tab));
      picker.querySelectorAll('[data-part-panel]').forEach((panel) => { panel.hidden = panel.dataset.partPanel !== tab.dataset.part; });
    });
    picker.addEventListener('change', applyPicker);
    document.querySelector('#apply').onclick = () => {
      try {
        const next = JSON.parse(text.value);
        applyDesign(next.identity);
        if (next.presentation !== undefined) applyPresentation(next.presentation);
        Object.assign(avatar.state, next.state || {});
        render();
      } catch (error) { status.textContent = `Configuración no válida: ${error.message}`; }
    };
    document.querySelector('#export-character').onclick = exportCharacter;
    document.querySelector('#import-character').onclick = () => characterFile.click();
    characterFile.onchange = async () => {
      try { await importCharacter(characterFile.files[0]); }
      catch (error) { status.textContent = `No se pudo cargar: ${error.message}`; }
      finally { characterFile.value = ''; }
    };
    document.querySelector('#talk').onclick = () => { setState({ speaking: true, reaction: 'none' }); setTimeout(() => setState({ speaking: false }), 5000); };
    document.querySelector('#react').onclick = () => { clearTimeout(reactionTimer); setState({ speaking: false, reaction: 'happy' }); reactionTimer = setTimeout(() => setState({ reaction: 'none' }), 2200); };
    document.querySelector('#idle').onclick = () => setState({ speaking: false, reaction: 'none' });
    renderPresentation();
    render();
  </script>
  <script type="module" src="./webmcp/register-avatar-tools.js?v=3"></script>
</body>
</html>
